<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Insurance Prediction</title>
    <!-- Corrected the CSS path -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Vehicle Insurance Prediction</h1>

        <form method="post" action="/">
            <label for="sex">Gender (male, female):</label>
            <input type="text" id="Gender" name="Gender" min="0" max="1" required>

            <label for="Age">Age:</label>
            <input type="number" id="Age" name="Age" required>

            <label for="Region_Code">Region Code: (northeast , northwest, southeast, southwest)</label>
            <input type="text" step="0.01" id="Region_Code" name="Region_Code" required>

            <label for="bmi">bmi:</label>
            <input type="number" step="0.01" id="bmi" name="bmi" required>

            <label for="children">children:</label>
            <input type="number" id="children" name="children" required>

            <label for="smoker">smoker (no,yes):</label>
            <input type="text" id="smoker" name="smoker" min="0" max="1" required>


            <button type="submit">Predict</button>
        </form>

        <form method="get" action="/train">
            <button type="submit" class="train-button">Train Model</button>
        </form>


        {% if context %}
            <div class="result">
                <h2>Result: {{ context }}</h2>
            </div>
        {% endif %}
    </div>
</body>
</html>
